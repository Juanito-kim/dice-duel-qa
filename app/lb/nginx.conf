# 앱 인스턴스 앞의 로드밸런서. "app" 이름이 가리키는 모든 컨테이너로 요청을 번갈아 보낸다.
# 인스턴스 수를 바꾼 뒤에는 lb를 다시 시작해야 새 인스턴스를 인식한다:
#   docker compose up -d --scale app=3
#   docker compose restart lb
events {}

http {
    upstream app {
        server app:8000;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
        }
    }
}
